# ビルド・テストと配布用 zip の作成
#
# - main への push / pull request: ビルドとテストを実行し、配布用 zip を Actions の成果物として保存
# - v で始まるタグ（例: v2.0.0）の push: 上記に加えて、zip を添付した GitHub Release を「下書き」で作成
#   （内容を確認してから GitHub 上で公開する）
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet test -c Release

      - name: 配布用ビルド（ランタイム同梱・exe 1 つ）
        run: dotnet publish src/VRCLogAnalyzer -c Release -p:PublishProfile=win-x64 -o publish

      - name: README の PDF 作成
        run: |
          python -m pip install --disable-pip-version-check -q markdown
          python tools/make_readme_pdf.py publish/README.pdf

      - name: zip 作成
        shell: pwsh
        run: |
          Copy-Item README.md, CHANGELOG.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath "VRCLogAnalyzer-${{ github.ref_name }}-win-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: VRCLogAnalyzer-win-x64
          path: VRCLogAnalyzer-*-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VRCLogAnalyzer-win-x64

      - name: Release を下書きで作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" VRCLogAnalyzer-*-win-x64.zip \
            --repo "${{ github.repository }}" \
            --draft \
            --title "VRCLogAnalyzer ${{ github.ref_name }}" \
            --notes "変更内容は CHANGELOG.md を参照してください。zip を展開して VRCLogAnalyzer.exe を起動してください（.NET のインストールは不要です）。"
